<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kochbuch &ndash; Rezeptindex</title>
<style>
  :root{
    --paper:#f6efe2;
    --paper-deep:#efe4cf;
    --ink:#2c231b;
    --ink-soft:#6b5d4c;
    --rule:#d8c9a8;
    --accent:#8a2e2e;
    --accent-soft:#c9d6b8;
    --card:#fffdf8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(44,35,27,0.05) 1px, transparent 0);
    background-size: 22px 22px;
    color:var(--ink);
    font-family: "Iowan Old Style","Palatino Linotype", Georgia, "Times New Roman", serif;
    min-height:100vh;
  }
  header{
    padding:2.6rem 1.5rem 1.4rem;
    text-align:center;
    border-bottom:1px solid var(--rule);
    background:linear-gradient(180deg, var(--paper-deep), var(--paper));
  }
  header .eyebrow{
    font-family: "Segoe Script","Bradley Hand", "Comic Sans MS", cursive;
    color:var(--accent);
    font-size:1.05rem;
    letter-spacing:.04em;
  }
  header h1{
    margin:.25rem 0 .3rem;
    font-size:2.6rem;
    font-weight:600;
    letter-spacing:.01em;
  }
  header p.sub{
    margin:0;
    color:var(--ink-soft);
    font-size:.95rem;
  }
  .controls{
    max-width:960px;
    margin:1.4rem auto 0;
    padding:0 1.5rem;
    display:flex;
    gap:.75rem;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
  }
  .controls input[type=search]{
    flex:1 1 320px;
    max-width:420px;
    padding:.6rem .9rem;
    border:1px solid var(--rule);
    border-radius:2px;
    background:var(--card);
    font-family:inherit;
    font-size:1rem;
    color:var(--ink);
  }
  .controls select{
    padding:.6rem .8rem;
    border:1px solid var(--rule);
    border-radius:2px;
    background:var(--card);
    font-family:inherit;
    font-size:.95rem;
    color:var(--ink);
  }
  .count{
    text-align:center;
    color:var(--ink-soft);
    font-size:.85rem;
    margin:.6rem 0 0;
    letter-spacing:.03em;
  }
  .grid{
    max-width:1180px;
    margin:1.6rem auto 4rem;
    padding:0 1.5rem;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px,1fr));
    gap:1.15rem;
  }
  .card{
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:3px;
    overflow:hidden;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
    display:flex;
    flex-direction:column;
  }
  .card:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 22px rgba(44,35,27,0.14);
  }
  .card .thumb{
    width:100%;
    padding-top:75%; /* 4:3 box via the classic padding-hack - works without CSS aspect-ratio support */
    position:relative;
    background:var(--paper-deep);
    display:block;
    color:var(--ink-soft);
    font-size:.8rem;
    overflow:hidden;
  }
  .card .thumb img{
    position:absolute;
    top:0; left:0;
    width:100%;height:100%;
    object-fit:cover;
    display:block;
  }
  .card .body{padding:.7rem .85rem .9rem;}
  .card h3{
    margin:0 0 .2rem;
    font-size:1.05rem;
    line-height:1.25;
  }
  .card .meta{
    color:var(--accent);
    font-size:.78rem;
    letter-spacing:.03em;
    font-family: "Segoe Script","Bradley Hand", "Comic Sans MS", cursive;
  }
  .card .cat-tag{
    display:inline-block;
    margin-top:.3rem;
    font-family: inherit;
    font-size:.68rem;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--ink-soft);
    background:var(--paper-deep);
    border-radius:8px;
    padding:.1rem .5rem;
  }

  /* Detail overlay */
  .overlay{
    position:fixed;inset:0;
    background:rgba(30,24,18,0.55);
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding:3vh 1rem;
    overflow-y:auto;
    z-index:50;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--card);
    max-width:760px;
    width:100%;
    border-radius:4px;
    border:1px solid var(--rule);
    padding:1.8rem 1.9rem 2.2rem;
    position:relative;
  }
  .sheet .close{
    position:absolute;
    top:.9rem;right:1rem;
    background:none;border:none;
    font-size:1.4rem;
    color:var(--ink-soft);
    cursor:pointer;
    line-height:1;
  }
  .sheet .close:hover{color:var(--accent);}
  .sheet .hero{
    display:flex;gap:1.2rem;
    align-items:flex-start;
    flex-wrap:wrap;
    margin-bottom:1.1rem;
  }
  .sheet .hero-img{
    width:220px;max-width:45vw;
    flex:0 0 auto;
  }
  .sheet .hero-img .ratio-box{
    width:100%;
    padding-top:75%; /* 4:3 box, relative to this wrapper's own (fixed) width */
    height:0;
    position:relative;
    border-radius:3px;
    border:1px solid var(--rule);
    overflow:hidden;
    background:var(--paper-deep);
  }
  .sheet .hero-img .ratio-box img{
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .sheet .hero .titles{flex:1 1 220px;}
  .sheet h2{margin:.1rem 0 .35rem;font-size:1.9rem;}
  .sheet .persons{
    font-family: "Segoe Script","Bradley Hand", "Comic Sans MS", cursive;
    color:var(--accent);
    font-size:1.1rem;
  }
  .sheet h4{
    margin:1.3rem 0 .5rem;
    font-size:.8rem;
    text-transform:uppercase;
    letter-spacing:.12em;
    color:var(--ink-soft);
    border-bottom:1px solid var(--rule);
    padding-bottom:.25rem;
  }
  .sheet ul.ingredients{list-style:none;margin:0;padding:0;}
  .sheet ul.ingredients li{
    padding:.28rem 0;
    border-bottom:1px dotted var(--rule);
    display:flex;
    gap:.5rem;
  }
  .sheet ul.ingredients li::before{content:"\2022";color:var(--accent);}
  .sheet .group-label{
    margin-top:.7rem;
    font-weight:600;
    color:var(--ink);
    font-size:.92rem;
  }
  .sheet ol.steps{margin:0;padding-left:1.3rem;}
  .sheet ol.steps li{padding:.35rem 0;line-height:1.5;}
  .sheet .notes{
    background:var(--accent-soft);
    border-radius:3px;
    padding:.8rem .95rem;
    font-size:.92rem;
    line-height:1.5;
  }
  .sheet .notes p{margin:.3rem 0;}
  .empty{
    text-align:center;
    color:var(--ink-soft);
    padding:3rem 1rem;
    font-style:italic;
  }
  @media (max-width:520px){
    header h1{font-size:2rem;}
    .sheet{padding:1.3rem 1.1rem 1.6rem;}
    .sheet .hero-img{width:150px;}
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">handgeschrieben, digitalisiert</div>
  <h1>Das Kochbuch</h1>
  <p class="sub" id="subCount">wird geladen &hellip;</p>
</header>

<div class="controls">
  <input type="search" id="search" placeholder="Rezept oder Zutat suchen &hellip;">
  <select id="catSel"><option value="">Alle Kategorien</option></select>
  <select id="sortSel">
    <option value="page">Reihenfolge im Buch</option>
    <option value="title">Alphabetisch</option>
  </select>
</div>
<p class="count" id="resultCount"></p>

<div class="grid" id="grid"></div>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<script>
let RECIPES = [];

const grid = document.getElementById('grid');
const overlay = document.getElementById('overlay');
const sheet = document.getElementById('sheet');
const searchInput = document.getElementById('search');
const sortSel = document.getElementById('sortSel');
const catSel = document.getElementById('catSel');
const resultCount = document.getElementById('resultCount');
const subCount = document.getElementById('subCount');

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Ein Ordner pro Rezept (data/<slug>/recipe.json + image.* + thumb.*), siehe docs/Arbeitsübergabe.md
async function loadRecipes(){
  const manifest = await fetch('data/index.json').then(res => res.json());
  const sorted = manifest.slice().sort((a, b) => a.order - b.order);
  return Promise.all(sorted.map(m => fetch(`data/recipes/${m.slug}/recipe.json`).then(res => res.json())));
}

function thumbSrc(r){
  const file = r.thumb || r.image;
  return file ? `data/recipes/${r.slug}/${file}` : null;
}

function imageSrc(r){
  return r.image ? `data/recipes/${r.slug}/${r.image}` : null;
}

function cardHtml(r, idx){
  const src = thumbSrc(r);
  const img = src ? `<img src="${escapeHtml(src)}" alt="${escapeHtml(r.title)}" loading="lazy">` : 'kein Foto';
  return `<div class="card" data-idx="${idx}">
    <div class="thumb">${img}</div>
    <div class="body">
      <h3>${escapeHtml(r.title)}</h3>
      <div class="meta">${escapeHtml(r.servings || '')}</div>
      ${r.category ? `<div class="cat-tag">${escapeHtml(r.category)}</div>` : ''}
    </div>
  </div>`;
}

function renderGrid(){
  const q = searchInput.value.trim().toLowerCase();
  const cat = catSel.value;
  let items = RECIPES.map((r, i) => ({r, i}));

  if(cat){
    items = items.filter(({r}) => r.category === cat);
  }

  if(q){
    items = items.filter(({r}) => {
      if(r.title.toLowerCase().includes(q)) return true;
      if((r.servings||'').toLowerCase().includes(q)) return true;
      if(r.ingredients.some(g => g.text.some(t => t.toLowerCase().includes(q)))) return true;
      if(r.steps.some(s => s.toLowerCase().includes(q))) return true;
      return false;
    });
  }

  if(sortSel.value === 'title'){
    items.sort((a,b) => a.r.title.localeCompare(b.r.title, 'de'));
  } else {
    items.sort((a,b) => (a.r.order ?? 0) - (b.r.order ?? 0));
  }

  resultCount.textContent = `${items.length} von ${RECIPES.length} Rezepten`;
  grid.innerHTML = items.length
    ? items.map(({r,i}) => cardHtml(r, i)).join('')
    : '<p class="empty">Keine Rezepte gefunden.</p>';
}

function openRecipe(idx){
  const r = RECIPES[idx];

  const ingredientsHtml = r.ingredients.map(g => `
    ${g.group ? `<div class="group-label">${escapeHtml(g.group)}</div>` : ''}
    <ul class="ingredients">${g.text.map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul>
  `).join('');

  const stepsHtml = r.steps.length
    ? `<h4>Zubereitung</h4><ol class="steps">${r.steps.map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ol>`
    : '';

  const notesHtml = r.notes && r.notes.length
    ? `<h4>Notizen</h4><div class="notes">${r.notes.map(n => `<p>${escapeHtml(n)}</p>`).join('')}</div>`
    : '';

  const src = imageSrc(r);
  const imgHtml = src
    ? `<div class="hero-img"><div class="ratio-box"><img src="${escapeHtml(src)}" alt="${escapeHtml(r.title)}"></div></div>`
    : '';

  sheet.innerHTML = `
    <button class="close" id="closeBtn" aria-label="Schließen">&times;</button>
    <div class="hero">
      ${imgHtml}
      <div class="titles">
        <h2>${escapeHtml(r.title)}</h2>
        <div class="persons">${escapeHtml(r.servings || '')}${r.category ? ' &middot; ' + escapeHtml(r.category) : ''}</div>
      </div>
    </div>
    <h4>Zutaten</h4>
    ${ingredientsHtml || '<p><em>keine erfasst</em></p>'}
    ${stepsHtml}
    ${notesHtml}
  `;
  overlay.classList.add('open');
  document.getElementById('closeBtn').addEventListener('click', closeRecipe);
}

function closeRecipe(){
  overlay.classList.remove('open');
  sheet.innerHTML = '';
}

grid.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if(card) openRecipe(parseInt(card.dataset.idx, 10));
});
overlay.addEventListener('click', e => {
  if(e.target === overlay) closeRecipe();
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeRecipe();
});
searchInput.addEventListener('input', renderGrid);
sortSel.addEventListener('change', renderGrid);
catSel.addEventListener('change', renderGrid);

async function init(){
  try {
    RECIPES = await loadRecipes();
  } catch(err) {
    console.error(err);
    subCount.textContent = 'Rezepte konnten nicht geladen werden.';
    grid.innerHTML = '<p class="empty">Fehler beim Laden der Rezepte.</p>';
    return;
  }

  const cats = [...new Set(RECIPES.map(r => r.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'de'));
  catSel.innerHTML = '<option value="">Alle Kategorien</option>' + cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');

  subCount.textContent = `${RECIPES.length} Rezepte`;
  renderGrid();
}

init();
</script>
</body>
</html>
