<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kochbuch &ndash; Rezeptindex</title>
<style>
  :root{
    --paper:#f6efe2;
    --paper-deep:#efe4cf;
    --ink:#2c231b;
    --ink-soft:#6b5d4c;
    --rule:#d8c9a8;
    --accent:#8a2e2e;
    --accent-soft:#c9d6b8;
    --card:#fffdf8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(44,35,27,0.05) 1px, transparent 0);
    background-size: 22px 22px;
    color:var(--ink);
    font-family: "Iowan Old Style","Palatino Linotype", Georgia, "Times New Roman", serif;
    min-height:100vh;
  }
  header{
    padding:2.6rem 1.5rem 1.4rem;
    text-align:center;
    border-bottom:1px solid var(--rule);
    background:linear-gradient(180deg, var(--paper-deep), var(--paper));
  }
  header .eyebrow{
    font-family: "Segoe Script","Bradley Hand", "Comic Sans MS", cursive;
    color:var(--accent);
    font-size:1.05rem;
    letter-spacing:.04em;
  }
  header h1{
    margin:.25rem 0 .3rem;
    font-size:2.6rem;
    font-weight:600;
    letter-spacing:.01em;
  }
  header p.sub{
    margin:0;
    color:var(--ink-soft);
    font-size:.95rem;
  }
  .controls{
    max-width:960px;
    margin:1.4rem auto 0;
    padding:0 1.5rem;
    display:flex;
    gap:.75rem;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
  }
  .controls input[type=search]{
    flex:1 1 320px;
    max-width:420px;
    padding:.6rem .9rem;
    border:1px solid var(--rule);
    border-radius:2px;
    background:var(--card);
    font-family:inherit;
    font-size:1rem;
    color:var(--ink);
  }
  .controls select{
    padding:.6rem .8rem;
    border:1px solid var(--rule);
    border-radius:2px;
    background:var(--card);
    font-family:inherit;
    font-size:.95rem;
    color:var(--ink);
  }
  .count{
    text-align:center;
    color:var(--ink-soft);
    font-size:.85rem;
    margin:.6rem 0 0;
    letter-spacing:.03em;
  }
  .grid{
    max-width:1180px;
    margin:1.6rem auto 4rem;
    padding:0 1.5rem;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px,1fr));
    gap:1.15rem;
  }
  .card{
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:3px;
    overflow:hidden;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
    display:flex;
    flex-direction:column;
  }
  .card:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 22px rgba(44,35,27,0.14);
  }
  .card .thumb{
    width:100%;
    padding-top:75%; /* 4:3 box via the classic padding-hack - works without CSS aspect-ratio support */
    position:relative;
    background:var(--paper-deep);
    display:block;
    color:var(--ink-soft);
    font-size:.8rem;
    overflow:hidden;
  }
  .card .thumb img{
    position:absolute;
    top:0; left:0;
    width:100%;height:100%;
    object-fit:cover;
    display:block;
  }
  .card .body{padding:.7rem .85rem .9rem;}
  .card h3{
    margin:0 0 .2rem;
    font-size:1.05rem;
    line-height:1.25;
  }
  .card .meta{
    color:var(--accent);
    font-size:.78rem;
    letter-spacing:.03em;
    font-family: "Segoe Script","Bradley Hand", "Comic Sans MS", cursive;
  }
  .card .cat-tag{
    display:inline-block;
    margin-top:.3rem;
    font-family: inherit;
    font-size:.68rem;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--ink-soft);
    background:var(--paper-deep);
    border-radius:8px;
    padding:.1rem .5rem;
  }

  /* Detail overlay */
  .overlay{
    position:fixed;inset:0;
    background:rgba(30,24,18,0.55);
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding:3vh 1rem;
    overflow-y:auto;
    z-index:50;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--card);
    max-width:760px;
    width:100%;
    border-radius:4px;
    border:1px solid var(--rule);
    padding:1.8rem 1.9rem 2.2rem;
    position:relative;
  }
  .sheet .close{
    position:absolute;
    top:.9rem;right:1rem;
    background:none;border:none;
    font-size:1.4rem;
    color:var(--ink-soft);
    cursor:pointer;
    line-height:1;
  }
  .sheet .close:hover{color:var(--accent);}
  .sheet .hero{
    display:flex;gap:1.2rem;
    align-items:flex-start;
    flex-wrap:wrap;
    margin-bottom:1.1rem;
  }
  .sheet .hero-img{
    width:220px;max-width:45vw;
    flex:0 0 auto;
  }
  .sheet .hero-img .ratio-box{
    width:100%;
    padding-top:75%; /* 4:3 box, relative to this wrapper's own (fixed) width */
    height:0;
    position:relative;
    border-radius:3px;
    border:1px solid var(--rule);
    overflow:hidden;
    background:var(--paper-deep);
  }
  .sheet .hero-img .ratio-box img{
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .sheet .hero .titles{flex:1 1 220px;}
  .sheet h2{margin:.1rem 0 .35rem;font-size:1.9rem;}
  .sheet .persons{
    font-family: "Segoe Script","Bradley Hand", "Comic Sans MS", cursive;
    color:var(--accent);
    font-size:1.1rem;
  }
  .sheet h4{
    margin:1.3rem 0 .5rem;
    font-size:.8rem;
    text-transform:uppercase;
    letter-spacing:.12em;
    color:var(--ink-soft);
    border-bottom:1px solid var(--rule);
    padding-bottom:.25rem;
  }
  .sheet ul.ingredients{list-style:none;margin:0;padding:0;}
  .sheet ul.ingredients li{
    padding:.28rem 0;
    border-bottom:1px dotted var(--rule);
    display:flex;
    gap:.5rem;
  }
  .sheet ul.ingredients li::before{content:"\2022";color:var(--accent);}
  .sheet .group-label{
    margin-top:.7rem;
    font-weight:600;
    color:var(--ink);
    font-size:.92rem;
  }
  .sheet ol.steps{margin:0;padding-left:1.3rem;}
  .sheet ol.steps li{padding:.35rem 0;line-height:1.5;}
  .sheet .notes{
    background:var(--accent-soft);
    border-radius:3px;
    padding:.8rem .95rem;
    font-size:.92rem;
    line-height:1.5;
  }
  .sheet .notes p{margin:.3rem 0;}
  .empty{
    text-align:center;
    color:var(--ink-soft);
    padding:3rem 1rem;
    font-style:italic;
  }

  /* Buttons */
  .btn{
    font-family:inherit;
    font-size:.85rem;
    padding:.5rem .95rem;
    border-radius:2px;
    border:1px solid var(--rule);
    background:var(--card);
    color:var(--ink);
    cursor:pointer;
  }
  .btn:hover{border-color:var(--accent); color:var(--accent);}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn-primary:hover{opacity:.88; color:#fff;}
  .btn-danger:hover{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn-row{display:flex; gap:.6rem; flex-wrap:wrap; margin:1rem 0;}
  .sheet .toolbar{margin-bottom:1.1rem;}

  /* Formular (Anlegen/Bearbeiten) */
  .form-field{margin-bottom:1rem;}
  .form-field label{
    display:block;
    font-size:.78rem;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--ink-soft);
    margin-bottom:.3rem;
  }
  .form-field input[type=text], .form-field textarea{
    width:100%;
    padding:.55rem .7rem;
    border:1px solid var(--rule);
    border-radius:2px;
    background:var(--card);
    font-family:inherit;
    font-size:.95rem;
    color:var(--ink);
    resize:vertical;
  }
  .form-field textarea{min-height:4.2rem;}
  .form-field textarea#ingredientsInput{min-height:9rem;}
  .form-field .hint{font-size:.72rem; color:var(--ink-soft); margin-top:.3rem;}
  .form-preview{
    width:150px;
    margin-bottom:.6rem;
  }
  .form-preview .ratio-box{
    width:100%;
    padding-top:75%;
    position:relative;
    border-radius:3px;
    border:1px solid var(--rule);
    overflow:hidden;
    background:var(--paper-deep);
  }
  .form-preview .ratio-box img{
    position:absolute; top:0; left:0;
    width:100%; height:100%;
    object-fit:cover;
  }
  .error-box{
    background:#fbeaea;
    border:1px solid var(--accent);
    color:var(--accent);
    border-radius:3px;
    padding:.6rem .8rem;
    font-size:.85rem;
    margin-bottom:1rem;
  }
  @media (max-width:520px){
    header h1{font-size:2rem;}
    .sheet{padding:1.3rem 1.1rem 1.6rem;}
    .sheet .hero-img{width:150px;}
  }

  /* Druckansicht: nur das offene Rezept, eine A4-Seite, angelehnt an die alte PDF-Vorlage
     (Foto oben links, Titel oben rechts, Zutaten als Liste, Schritte nummeriert). */
  @media print{
    @page{size:A4; margin:1.5cm;}
    header, .controls, .count, .grid{display:none !important;}
    body{background:none !important;}
    .overlay.open{
      position:static !important;
      display:block !important;
      background:none !important;
      padding:0 !important;
      inset:auto !important;
    }
    .sheet{
      max-width:100% !important;
      width:auto !important;
      padding:0 !important;
      border:none !important;
      background:#fff !important;
    }
    .sheet .close, .sheet .btn-row{display:none !important;}
    .sheet .hero-img{width:200px;}
    .ingredients-wrap.two-col{
      columns:2;
      column-gap:1.8rem;
    }
    .ingredients-wrap.two-col .group-label{break-inside:avoid; break-after:avoid;}
    .ingredients-wrap.two-col ul.ingredients{break-inside:avoid;}
    .ingredients-wrap.two-col ul.ingredients li{break-inside:avoid;}
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">handgeschrieben, digitalisiert</div>
  <h1>Das Kochbuch</h1>
  <p class="sub" id="subCount">wird geladen &hellip;</p>
</header>

<div class="controls">
  <input type="search" id="search" placeholder="Rezept oder Zutat suchen &hellip;">
  <select id="catSel"><option value="">Alle Kategorien</option></select>
  <select id="sortSel">
    <option value="page">Reihenfolge im Buch</option>
    <option value="title">Alphabetisch</option>
  </select>
  <button class="btn btn-primary" id="newRecipeBtn" type="button">+ Neues Rezept</button>
</div>
<p class="count" id="resultCount"></p>

<div class="grid" id="grid"></div>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<script>
let RECIPES = [];

const grid = document.getElementById('grid');
const overlay = document.getElementById('overlay');
const sheet = document.getElementById('sheet');
const searchInput = document.getElementById('search');
const sortSel = document.getElementById('sortSel');
const catSel = document.getElementById('catSel');
const resultCount = document.getElementById('resultCount');
const subCount = document.getElementById('subCount');
const newRecipeBtn = document.getElementById('newRecipeBtn');

const TOKEN_KEY = 'kochbuch_api_token';

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// PHP liefert die Rezeptliste über die JSON-API (api/recipes.php), siehe docs/Arbeitsübergabe.md
async function loadRecipes(){
  const data = await fetch('api/recipes.php').then(res => res.json());
  return data.recipes;
}

function getStoredToken(){
  return localStorage.getItem(TOKEN_KEY) || '';
}

function forgetToken(){
  localStorage.removeItem(TOKEN_KEY);
}

/** Holt das gespeicherte API-Token oder fragt es einmalig per prompt() ab und merkt es sich in localStorage. */
function requireToken(){
  let token = getStoredToken();
  if(!token){
    token = (window.prompt('API-Token für Änderungen eingeben:') || '').trim();
    if(token) localStorage.setItem(TOKEN_KEY, token);
  }
  return token;
}

/**
 * fetch()-Wrapper für schreibende API-Aufrufe: hängt das Token an, wirft bei
 * 401 (und vergisst dann das falsche Token) bzw. anderen Fehlerstatus mit der
 * Server-Fehlermeldung als Error.
 */
async function apiWrite(url, options){
  const token = requireToken();
  if(!token){
    throw new Error('Ohne Token sind keine Änderungen möglich.');
  }
  options = options || {};
  options.headers = Object.assign({}, options.headers, {'X-API-Token': token});

  const res = await fetch(url, options);
  if(res.status === 401){
    forgetToken();
    throw new Error('Token wurde vom Server abgelehnt. Bitte erneut versuchen.');
  }
  const body = await res.json().catch(() => ({}));
  if(!res.ok){
    const msg = body.details ? body.details.join('; ') : (body.error || `HTTP ${res.status}`);
    throw new Error(msg);
  }
  return body;
}

// data/ liegt außerhalb des Document Root, Bilder laufen deshalb über api/image.php statt über eine statische URL.
function thumbSrc(r){
  if(!r.image) return null;
  const type = r.thumb ? 'thumb' : 'image';
  return `api/image.php?slug=${encodeURIComponent(r.slug)}&type=${type}`;
}

function imageSrc(r){
  return r.image ? `api/image.php?slug=${encodeURIComponent(r.slug)}&type=image` : null;
}

function cardHtml(r, idx){
  const src = thumbSrc(r);
  const img = src ? `<img src="${escapeHtml(src)}" alt="${escapeHtml(r.title)}" loading="lazy">` : 'kein Foto';
  return `<div class="card" data-idx="${idx}">
    <div class="thumb">${img}</div>
    <div class="body">
      <h3>${escapeHtml(r.title)}</h3>
      <div class="meta">${escapeHtml(r.servings || '')}</div>
      ${r.category ? `<div class="cat-tag">${escapeHtml(r.category)}</div>` : ''}
    </div>
  </div>`;
}

/** Alle bereits verwendeten Kategorien (aus dem aktuellen RECIPES-Stand), alphabetisch, ohne Duplikate. */
function knownCategories(){
  return [...new Set(RECIPES.map(r => r.category).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'de'));
}

function renderGrid(){
  const q = searchInput.value.trim().toLowerCase();
  const cat = catSel.value;
  let items = RECIPES.map((r, i) => ({r, i}));

  if(cat){
    items = items.filter(({r}) => r.category === cat);
  }

  if(q){
    items = items.filter(({r}) => {
      if(r.title.toLowerCase().includes(q)) return true;
      if((r.servings||'').toLowerCase().includes(q)) return true;
      if(r.ingredients.some(g => g.text.some(t => t.toLowerCase().includes(q)))) return true;
      if(r.steps.some(s => s.toLowerCase().includes(q))) return true;
      return false;
    });
  }

  if(sortSel.value === 'title'){
    items.sort((a,b) => a.r.title.localeCompare(b.r.title, 'de'));
  } else {
    items.sort((a,b) => (a.r.order ?? 0) - (b.r.order ?? 0));
  }

  resultCount.textContent = `${items.length} von ${RECIPES.length} Rezepten`;
  grid.innerHTML = items.length
    ? items.map(({r,i}) => cardHtml(r, i)).join('')
    : '<p class="empty">Keine Rezepte gefunden.</p>';
}

/**
 * Baut den Inhalt, der sowohl in der Lese-Ansicht als auch beim Drucken sichtbar ist
 * (Hero-Bild/Titel, Zutaten, Zubereitung, Notizen — ohne Toolbar/Schließen-Button).
 * Wird auch fürs unsichtbare Vermessen der Druckhöhe in printRecipe() wiederverwendet.
 */
function printableSheetHtml(r){
  const ingredientsHtml = r.ingredients.map(g => `
    ${g.group ? `<div class="group-label">${escapeHtml(g.group)}</div>` : ''}
    <ul class="ingredients">${g.text.map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul>
  `).join('');

  const stepsHtml = r.steps.length
    ? `<h4>Zubereitung</h4><ol class="steps">${r.steps.map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ol>`
    : '';

  const noteLines = r.notes ? r.notes.split('\n').map(s => s.trim()).filter(Boolean) : [];
  const notesHtml = noteLines.length
    ? `<h4>Notizen</h4><div class="notes">${noteLines.map(n => `<p>${escapeHtml(n)}</p>`).join('')}</div>`
    : '';

  const src = imageSrc(r);
  const imgHtml = src
    ? `<div class="hero-img"><div class="ratio-box"><img src="${escapeHtml(src)}" alt="${escapeHtml(r.title)}"></div></div>`
    : '';

  return `
    <div class="hero">
      ${imgHtml}
      <div class="titles">
        <h2>${escapeHtml(r.title)}</h2>
        <div class="persons">${escapeHtml(r.servings || '')}${r.category ? ' &middot; ' + escapeHtml(r.category) : ''}</div>
      </div>
    </div>
    <h4>Zutaten</h4>
    <div class="ingredients-wrap" id="ingredientsWrap">${ingredientsHtml || '<p><em>keine erfasst</em></p>'}</div>
    ${stepsHtml}
    ${notesHtml}
  `;
}

function openRecipe(idx){
  const r = RECIPES[idx];

  sheet.innerHTML = `
    <button class="close" id="closeBtn" aria-label="Schließen">&times;</button>
    <div class="btn-row toolbar">
      <button class="btn" id="printBtn" type="button">Drucken</button>
      <button class="btn" id="editBtn" type="button">Bearbeiten</button>
      <button class="btn btn-danger" id="deleteBtn" type="button">Löschen</button>
    </div>
    ${printableSheetHtml(r)}
  `;
  overlay.classList.add('open');
  document.getElementById('closeBtn').addEventListener('click', closeRecipe);
  document.getElementById('printBtn').addEventListener('click', () => printRecipe(r));
  document.getElementById('editBtn').addEventListener('click', () => openEditForm(r));
  document.getElementById('deleteBtn').addEventListener('click', () => deleteRecipeUI(r));
}

// A4 (21 x 29,7cm) minus je 1,5cm Rand (siehe @page-Regel), umgerechnet in CSS-px (96dpi, 1cm = 37.8px)
const PRINT_CONTENT_WIDTH_PX = Math.round((21 - 2 * 1.5) * 37.8);
const PRINT_CONTENT_HEIGHT_PX = Math.round((29.7 - 2 * 1.5) * 37.8);

/**
 * Rendert $html unsichtbar (außerhalb des Viewports) in der Zielbreite einer Druckseite
 * und liefert die resultierende Höhe in px. Reine Schätzung zur Layout-Entscheidung, nicht
 * die exakte Höhe, mit der der Browser am Ende paginiert.
 */
function measurePrintHeight(html, twoColIngredients){
  const probe = document.createElement('div');
  probe.className = 'sheet';
  probe.style.position = 'absolute';
  probe.style.left = '-9999px';
  probe.style.top = '0';
  probe.style.visibility = 'hidden';
  probe.style.width = PRINT_CONTENT_WIDTH_PX + 'px';
  probe.style.padding = '0';
  probe.style.border = 'none';
  probe.style.boxSizing = 'border-box';
  probe.innerHTML = html;

  if(twoColIngredients){
    const wrap = probe.querySelector('.ingredients-wrap');
    if(wrap){
      wrap.style.columns = '2';
      wrap.style.columnGap = '1.8rem';
    }
  }

  document.body.appendChild(probe);
  const height = probe.scrollHeight;
  probe.remove();
  return height;
}

/**
 * Prüft (näherungsweise, siehe measurePrintHeight), ob das Rezept auf eine A4-Druckseite passt.
 * Falls nicht, werden die Zutaten für den Ausdruck zweispaltig dargestellt (nur beim Drucken
 * sichtbar, siehe .ingredients-wrap.two-col in @media print), um mehr auf die Seite zu bekommen.
 */
function printRecipe(r){
  const html = printableSheetHtml(r);
  const fitsOneColumn = measurePrintHeight(html, false) <= PRINT_CONTENT_HEIGHT_PX;

  const wrap = document.getElementById('ingredientsWrap');
  if(wrap) wrap.classList.toggle('two-col', !fitsOneColumn);

  window.print();
}

function closeRecipe(){
  overlay.classList.remove('open');
  sheet.innerHTML = '';
}

/**
 * Formatiert die gruppierten ingredients (API-Format) als einfachen Text fürs Formular:
 * eine Zutat pro Zeile, eine Zeile mit führendem "#" markiert eine neue Gruppenüberschrift.
 * Vor jeder Gruppenüberschrift (außer ganz am Anfang) steht zur besseren Lesbarkeit eine
 * Leerzeile; parseIngredientsText() ignoriert Leerzeilen beim Zurückparsen wieder.
 */
function formatIngredientsText(ingredients){
  return ingredients.map((g, i) => {
    const lines = g.group ? [`# ${g.group}:`, ...g.text] : g.text.slice();
    if(g.group && i > 0) lines.unshift('');
    return lines.join('\n');
  }).join('\n');
}

/** Nummeriert die Zubereitungsschritte fürs Formular durch ("1. ", "2. ", ...). Umkehrfunktion zu parseStepsText(). */
function formatStepsText(steps){
  return steps.map((s, i) => `${i + 1}. ${s}`).join('\n');
}

/**
 * Entfernt eine vom User eingegebene Nummerierung ("1.", "2)", ...) oder ein Listenzeichen
 * ("-", "*") am Zeilenanfang wieder – Bsp1–Bsp4 aus der Anfrage führen alle zum selben Ergebnis.
 * Leerzeilen werden ignoriert.
 */
function parseStepsText(text){
  return text.split('\n')
    .map(s => s.trim().replace(/^(?:\d+[.)]|[-*])\s*/, ''))
    .filter(Boolean);
}

/**
 * Parst den einfachen Zutaten-Text zurück ins gruppierte API-Format. Zeilen mit führendem "#"
 * eröffnen eine neue Gruppe (Text danach = Gruppenname, ein optionaler abschließender Doppelpunkt
 * wird entfernt; "#" allein bzw. ohne Text danach = zurück zu "ohne Überschrift"). Leere Zeilen
 * und Gruppen ohne Zutaten werden verworfen.
 */
function parseIngredientsText(text){
  const groups = [];
  let currentGroup = null;
  let bucket = [];
  const flush = () => {
    if(bucket.length) groups.push({group: currentGroup, text: bucket});
    bucket = [];
  };
  for(const raw of text.split('\n')){
    const line = raw.trim();
    if(line.startsWith('#')){
      flush();
      let name = line.slice(1).trim();
      if(name.endsWith(':')) name = name.slice(0, -1).trim();
      currentGroup = name || null;
    } else if(line){
      bucket.push(line);
    }
  }
  flush();
  return groups;
}

/** Zeigt das Anlege-/Bearbeitungsformular. $r === null bedeutet: neues Rezept. */
function openEditForm(r){
  const isEdit = r !== null;
  const ingredientsText = isEdit ? formatIngredientsText(r.ingredients) : '';
  const stepsText = isEdit ? formatStepsText(r.steps) : '';
  const notesText = isEdit ? (r.notes || '') : '';
  const src = isEdit ? imageSrc(r) : null;
  const previewHtml = src
    ? `<div class="form-preview"><div class="ratio-box"><img id="imgPreview" src="${escapeHtml(src)}" alt=""></div></div>`
    : `<div class="form-preview" id="previewWrap" style="display:none"><div class="ratio-box"><img id="imgPreview" src="" alt=""></div></div>`;

  sheet.innerHTML = `
    <button class="close" id="closeBtn" aria-label="Schließen">&times;</button>
    <h2>${isEdit ? 'Rezept bearbeiten' : 'Neues Rezept'}</h2>
    <div id="formError"></div>
    <div class="form-field">
      <label for="titleInput">Titel</label>
      <input type="text" id="titleInput" value="${isEdit ? escapeHtml(r.title) : ''}">
    </div>
    <div class="form-field">
      <label for="categoryInput">Kategorie</label>
      <input type="text" id="categoryInput" list="categoryList" value="${isEdit ? escapeHtml(r.category || '') : ''}">
      <datalist id="categoryList">${knownCategories().map(c => `<option value="${escapeHtml(c)}">`).join('')}</datalist>
    </div>
    <div class="form-field">
      <label for="servingsInput">Personen</label>
      <input type="text" id="servingsInput" value="${isEdit ? escapeHtml(r.servings || '') : ''}" placeholder="z. B. für 4 Personen">
    </div>
    <div class="form-field">
      <label>Bild</label>
      ${previewHtml}
      <input type="file" id="imageInput" accept="image/jpeg,image/png,image/webp">
      <div class="hint">Wird erst nach dem Speichern hochgeladen. Erzeugt automatisch ein Thumbnail.</div>
    </div>
    <div class="form-field">
      <label for="ingredientsInput">Zutaten</label>
      <textarea id="ingredientsInput">${escapeHtml(ingredientsText)}</textarea>
      <div class="hint">Eine Zutat pro Zeile. Eine Zeile mit # markiert eine neue Gruppenüberschrift, z. B. "# Für die Soße:"</div>
    </div>
    <div class="form-field">
      <label for="stepsInput">Zubereitung (ein Schritt pro Zeile)</label>
      <textarea id="stepsInput">${escapeHtml(stepsText)}</textarea>
      <div class="hint">Nummerierung nur zur Übersicht, wird beim Speichern entfernt. "1.", "-" oder "*" am Zeilenanfang werden ignoriert.</div>
    </div>
    <div class="form-field">
      <label for="notesInput">Notizen</label>
      <textarea id="notesInput">${escapeHtml(notesText)}</textarea>
      <div class="hint">Freier Text. In der Leseansicht wird jede Zeile als eigener Absatz dargestellt.</div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="saveBtn" type="button">Speichern</button>
      <button class="btn" id="cancelBtn" type="button">Abbrechen</button>
    </div>
  `;
  overlay.classList.add('open');

  document.getElementById('closeBtn').addEventListener('click', closeRecipe);
  document.getElementById('cancelBtn').addEventListener('click', () => {
    isEdit ? openRecipe(RECIPES.indexOf(r)) : closeRecipe();
  });
  document.getElementById('imageInput').addEventListener('change', e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let wrap = document.getElementById('previewWrap');
      if(wrap){ wrap.style.display = ''; }
      document.getElementById('imgPreview').src = reader.result;
    };
    reader.readAsDataURL(file);
  });
  document.getElementById('saveBtn').addEventListener('click', () => saveRecipe(isEdit ? r.slug : null));
}

/** Liest die Formularfelder aus und baut daraus den API-Payload (ohne leere Zutatengruppen/-zeilen). */
function collectFormData(){
  const title = document.getElementById('titleInput').value.trim();
  const category = document.getElementById('categoryInput').value.trim();
  const servings = document.getElementById('servingsInput').value.trim();

  const ingredients = parseIngredientsText(document.getElementById('ingredientsInput').value);

  const steps = parseStepsText(document.getElementById('stepsInput').value);
  const notes = document.getElementById('notesInput').value.trim() || null;

  return {title, category, servings, ingredients, steps, notes};
}

async function saveRecipe(slug){
  const payload = collectFormData();
  const errorBox = document.getElementById('formError');
  errorBox.innerHTML = '';

  if(!payload.title){
    errorBox.innerHTML = '<div class="error-box">Titel ist erforderlich.</div>';
    return;
  }

  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;
  saveBtn.textContent = 'Speichert …';

  let saved;
  try {
    const url = slug ? `api/recipes.php?slug=${encodeURIComponent(slug)}` : 'api/recipes.php';
    saved = await apiWrite(url, {
      method: slug ? 'PUT' : 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    });
  } catch(err){
    errorBox.innerHTML = `<div class="error-box">${escapeHtml(err.message)}</div>`;
    saveBtn.disabled = false;
    saveBtn.textContent = 'Speichern';
    return;
  }

  // Text-Teil ist ab hier gespeichert. Ein evtl. folgender Bild-Upload-Fehler
  // darf diesen Erfolg nicht mehr verschlucken (sonst wirkt es, als sei nichts gespeichert).
  let imageError = null;
  const fileInput = document.getElementById('imageInput');
  if(fileInput.files[0]){
    try {
      const fd = new FormData();
      fd.append('slug', saved.slug);
      fd.append('image', fileInput.files[0]);
      saved = await apiWrite('api/upload.php', {method: 'POST', body: fd});
    } catch(err){
      imageError = err.message;
    }
  }

  RECIPES = RECIPES.filter(x => x.slug !== slug && x.slug !== saved.slug);
  RECIPES.push(saved);
  renderGrid();
  openRecipe(RECIPES.indexOf(saved));
  if(imageError){
    alert('Rezept gespeichert, aber Bild-Upload fehlgeschlagen: ' + imageError);
  }
}

async function deleteRecipeUI(r){
  if(!window.confirm(`"${r.title}" wirklich unwiderruflich löschen?`)) return;
  try {
    await apiWrite(`api/recipes.php?slug=${encodeURIComponent(r.slug)}`, {method: 'DELETE'});
    RECIPES = RECIPES.filter(x => x.slug !== r.slug);
    closeRecipe();
    renderGrid();
  } catch(err){
    alert('Löschen fehlgeschlagen: ' + err.message);
  }
}

grid.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if(card) openRecipe(parseInt(card.dataset.idx, 10));
});
overlay.addEventListener('click', e => {
  if(e.target === overlay) closeRecipe();
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeRecipe();
});
searchInput.addEventListener('input', renderGrid);
sortSel.addEventListener('change', renderGrid);
catSel.addEventListener('change', renderGrid);
newRecipeBtn.addEventListener('click', () => openEditForm(null));

async function init(){
  try {
    RECIPES = await loadRecipes();
  } catch(err) {
    console.error(err);
    subCount.textContent = 'Rezepte konnten nicht geladen werden.';
    grid.innerHTML = '<p class="empty">Fehler beim Laden der Rezepte.</p>';
    return;
  }

  const cats = knownCategories();
  catSel.innerHTML = '<option value="">Alle Kategorien</option>' + cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');

  subCount.textContent = `${RECIPES.length} Rezepte`;
  renderGrid();
}

init();
</script>
